<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設計理念列印工具 | DUET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Caveat:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="assets/js/config.js"></script>
<style>
/* ── 全域 reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ────────────────────────────────────────────
   螢幕 UI
──────────────────────────────────────────── */
body {
    font-family: 'Noto Serif TC', serif;
    background: #1a1814;
    color: #e8e0d0;
    min-height: 100vh;
}

.app-header {
    padding: 20px 32px;
    border-bottom: 1px solid rgba(212,175,55,0.2);
    display: flex;
    align-items: baseline;
    gap: 16px;
}
.app-header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 400;
    color: #d4af37;
    letter-spacing: 2px;
}
.app-header span {
    font-size: 12px;
    color: rgba(232,224,208,0.45);
    letter-spacing: 1px;
}

.app-layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: calc(100vh - 65px);
}

/* 左側輸入面板 */
.input-panel {
    padding: 28px 24px;
    border-right: 1px solid rgba(255,255,255,0.07);
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
}
.input-panel label {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: rgba(232,224,208,0.45);
    text-transform: uppercase;
    display: block;
    margin-bottom: 8px;
}
.input-panel textarea {
    width: 100%;
    height: 260px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 14px;
    color: #e8e0d0;
    font-family: 'Noto Serif TC', serif;
    font-size: 13px;
    line-height: 1.8;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
}
.input-panel textarea:focus { border-color: rgba(212,175,55,0.35); }

.char-count {
    font-size: 11px;
    color: rgba(232,224,208,0.3);
    text-align: right;
    margin-top: -12px;
}
.layout-hint {
    font-size: 11px;
    color: rgba(212,175,55,0.7);
    padding: 10px 12px;
    background: rgba(212,175,55,0.06);
    border: 1px solid rgba(212,175,55,0.15);
    border-radius: 8px;
    line-height: 1.6;
}
.print-btn {
    background: linear-gradient(135deg, #d4af37, #aa8a2e);
    border: none;
    color: #1a1814;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    transition: opacity 0.2s;
}
.print-btn:hover { opacity: 0.88; }
.print-note {
    font-size: 11px;
    color: rgba(232,224,208,0.35);
    line-height: 1.8;
    padding-top: 4px;
}

/* 右側預覽面板 */
.preview-panel {
    overflow: auto;
    background: #111009;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 24px;
    gap: 12px;
}
.preview-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(212,175,55,0.5);
    text-transform: uppercase;
    align-self: flex-start;
}

/* 縮放包裝 (transform-origin = top center) */
#scale-wrap {
    transform-origin: top center;
}

/* ────────────────────────────────────────────
   卡片版面（螢幕預覽 & 列印共用）

   規格：
     A4 直式  210mm × 297mm
     每張 2 個卡片內頁
     每個展開  180mm × 110mm（左右各 90mm）
     左邊距    15mm  = (210-180)/2
     card-1 top 25.67mm = (297-220)/3
     card-2 top 161.33mm = 25.67+110+25.67
     文字區各半邊距折線 6mm、距切割邊 6mm
──────────────────────────────────────────── */
.print-sheet {
    width: 210mm;
    height: 297mm;
    position: relative;
    background: white;
    overflow: visible; /* 讓裁切角標可溢出 */
}

/* 每個卡片展開 */
.card-inner {
    position: absolute;
    width: 180mm;
    height: 110mm;
    left: 15mm;
    overflow: hidden;
}
.card-inner.card-1 { top: 25.67mm; }
.card-inner.card-2 { top: 161.33mm; }

/* 折疊虛線（僅螢幕顯示） */
.fold-guide {
    position: absolute;
    left: 90mm;
    top: 0; bottom: 0;
    width: 0;
    border-left: 0.5pt dashed rgba(100,92,82,0.3);
    pointer-events: none;
}

/* 裁切角標 */
.cut {
    position: absolute;
    width: 5mm; height: 5mm;
    border-color: #999;
    border-style: solid;
    border-width: 0;
    /* 溢出卡片邊界 2mm */
}
.cut.tl { top: -2mm;    left: -2mm;    border-top-width: 0.4pt;    border-left-width: 0.4pt;  }
.cut.tr { top: -2mm;    right: -2mm;   border-top-width: 0.4pt;    border-right-width: 0.4pt; }
.cut.bl { bottom: -2mm; left: -2mm;    border-bottom-width: 0.4pt; border-left-width: 0.4pt;  }
.cut.br { bottom: -2mm; right: -2mm;   border-bottom-width: 0.4pt; border-right-width: 0.4pt; }

/* ── 文字區（CSS 雙欄，自動從左欄流入右欄）──
   總文字寬：180-6-6 = 168mm
   欄間距（折線兩側各 6mm）：12mm
   每欄寬：(168-12)/2 = 78mm
   容器高：110-8-6 = 96mm
   簽名佔：17mm(margin)+1mm(線) = 18mm
   文字可用：96-18 = 78mm → 行高 8.3mm → 9.4 行 → 精準 9 行
*/
.card-text {
    position: absolute;
    left: 6mm;
    right: 6mm;
    top: 8mm;
    bottom: 6mm;
    columns: 2;
    column-gap: 12mm;
    column-fill: auto;
    font-family: 'Ma Shan Zheng', 'Caveat', 'Noto Serif TC', serif;
    font-size: 4.5mm;
    line-height: 1.65;
    color: #2e2a24;
    text-align: justify;
    overflow: hidden;
    orphans: 2;
    widows: 2;
}

/* 段落間距 */
.card-text p {
    margin-bottom: 0.55em;
    break-inside: avoid;
}
.card-text p:last-of-type { margin-bottom: 0; }

/* 簽名區：在文字流末端，右對齊紅線
   margin-top: 17mm = 2 行視覺距離（行高 8.3mm × 2 ≈ 16.6mm）
*/
.sig-block {
    break-inside: avoid;
    break-before: avoid;
    margin-top: 17mm;
    text-align: right;
}
.sig-line {
    display: inline-block;
    width: 38mm;
    border-bottom: 0.5pt solid #c0392b;
    vertical-align: bottom;
}

/* ────────────────────────────────────────────
   列印樣式
──────────────────────────────────────────── */
@media print {
    @page { size: 210mm 297mm; margin: 0; }

    /* 螢幕 UI 全部隱藏 */
    .app-header,
    .app-layout { display: none !important; }

    /* 列印時 print-sheet 以原始尺寸輸出 */
    #print-container {
        display: block !important;
        position: fixed;
        top: 0; left: 0;
        width: 210mm;
        height: 297mm;
    }

    .print-sheet {
        transform: none !important;
        width: 210mm;
        height: 297mm;
    }

    /* 折疊虛線列印時隱藏 */
    .fold-guide { display: none !important; }

    /* 螢幕預覽縮放包裝：取消 transform */
    #scale-wrap { transform: none !important; }

    /* 批次列印頁 */
    .batch-page {
        width: 210mm;
        height: 297mm;
        position: relative;
        background: white;
        page-break-after: always;
    }
    .batch-page:last-child { page-break-after: auto; }
    #batch-container { display: block !important; }
    #print-container { display: none !important; }
}

/* ── 批次模式 UI ── */
.batch-section {
    display: none;
    flex-direction: column;
    gap: 10px;
}
.batch-section.visible { display: flex; }
.batch-section textarea {
    width: 100%;
    height: 120px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 12px;
    color: #e8e0d0;
    font-family: 'Noto Serif TC', serif;
    font-size: 12px;
    line-height: 1.8;
    resize: vertical;
    outline: none;
}
.batch-toggle {
    background: rgba(212,175,55,0.1);
    border: 1px solid rgba(212,175,55,0.25);
    color: #d4af37;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: background 0.2s;
}
.batch-toggle:hover { background: rgba(212,175,55,0.2); }
.batch-toggle.active {
    background: rgba(212,175,55,0.2);
    border-color: rgba(212,175,55,0.5);
}

/* ── 批次列印版面 ── */
.batch-page {
    width: 210mm;
    height: 297mm;
    position: relative;
    background: white;
}
.batch-slot {
    position: absolute;
    width: 90mm;
    height: 135mm;
    top: 81mm;
}
.batch-slot.slot-left  { left: 10mm; }
.batch-slot.slot-right { left: 110mm; }

/* 封面卡片 */
.cover-card {
    width: 100%;
    height: 100%;
    border: 0.5pt solid #ccc;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5mm;
    padding: 8mm;
    font-family: 'Cormorant Garamond', serif;
    color: #2e2a24;
    text-align: center;
}
.cover-card .cover-brand {
    font-size: 7mm;
    letter-spacing: 4mm;
    font-weight: 400;
    color: #c9a96e;
}
.cover-card .cover-letters {
    font-size: 11mm;
    letter-spacing: 3mm;
    font-style: italic;
}
.cover-card .cover-meta {
    font-size: 3.2mm;
    color: #888;
    letter-spacing: 0.5mm;
    line-height: 1.8;
}
.cover-card .cover-divider {
    width: 20mm;
    height: 0.3pt;
    background: #ccc;
}

/* 設計理念卡片（批次版） */
.story-card {
    width: 100%;
    height: 100%;
    overflow: hidden;
    padding: 6mm;
    display: flex;
    flex-direction: column;
    gap: 3mm;
}
.story-card .story-header {
    font-family: 'Cormorant Garamond', serif;
    font-size: 3mm;
    letter-spacing: 1mm;
    color: #aaa;
    border-bottom: 0.3pt solid #ddd;
    padding-bottom: 2mm;
}
.story-card .story-text {
    font-family: 'Ma Shan Zheng', 'Noto Serif TC', serif;
    font-size: 3.8mm;
    line-height: 1.65;
    color: #2e2a24;
    text-align: justify;
    overflow: hidden;
    flex: 1;
}
.story-card .story-text p { margin-bottom: 0.5em; }
.story-card .story-sig {
    text-align: right;
    padding-top: 3mm;
}
.story-card .story-sig-line {
    display: inline-block;
    width: 25mm;
    border-bottom: 0.5pt solid #c0392b;
    vertical-align: bottom;
}

/* 批次列印螢幕預覽容器 */
#batch-container {
    display: none;
    margin-top: 16px;
}
#batch-preview {
    font-size: 11px;
    color: rgba(212,175,55,0.7);
    margin-top: 4px;
}
</style>
</head>
<body>

<div class="app-header">
    <h1>DUET</h1>
    <span>設計理念列印工具 / Design Story Print Tool</span>
</div>

<div class="app-layout">

    <!-- 左側：輸入面板 -->
    <div class="input-panel">
        <div>
            <label>訂單編號自動匯入</label>
            <div style="display:flex;gap:8px;">
                <input id="order-id-input" type="text" placeholder="例：D20260502-001"
                    style="flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
                           border-radius:8px;padding:10px 12px;color:#e8e0d0;
                           font-family:'Noto Serif TC',serif;font-size:13px;outline:none;
                           transition:border-color 0.2s;"
                    onfocus="this.style.borderColor='rgba(212,175,55,0.35)'"
                    onblur="this.style.borderColor='rgba(255,255,255,0.1)'"
                    onkeydown="if(event.key==='Enter')importOrder()">
                <button onclick="importOrder()"
                    style="background:rgba(212,175,55,0.15);border:1px solid rgba(212,175,55,0.3);
                           color:#d4af37;padding:10px 14px;border-radius:8px;font-size:13px;
                           cursor:pointer;white-space:nowrap;transition:background 0.2s;"
                    onmouseover="this.style.background='rgba(212,175,55,0.25)'"
                    onmouseout="this.style.background='rgba(212,175,55,0.15)'">匯入</button>
            </div>
            <div id="import-status" style="font-size:11px;color:rgba(232,224,208,0.4);margin-top:6px;min-height:16px;"></div>
        </div>

        <div>
            <label>設計理念（貼入文字）</label>
            <textarea id="story-input" placeholder="在此貼入設計理念文字...

文字會自動從左欄填滿後流入右欄。
左欄為打開卡片後正面（封面內側），
右欄為背面內側。"></textarea>
            <div class="char-count"><span id="char-count">0</span> 字</div>
        </div>

        <div class="layout-hint">
            📄 雙欄排版 · 左欄優先，自動流入右欄<br>
            ✍️ 簽名線自動出現在文字末尾
        </div>

        <button class="print-btn" onclick="window.print()">列印 / 匯出 PDF</button>

        <div style="border-top:1px solid rgba(255,255,255,0.07);padding-top:16px;">
            <button class="batch-toggle" id="batchToggleBtn" onclick="toggleBatchMode()">批次模式（多筆訂單）</button>
            <div class="batch-section" id="batchSection">
                <label style="margin-top:8px;">批次訂單編號（一行一筆）</label>
                <textarea id="batchInput" placeholder="D20260502-001&#10;D20260502-002&#10;D20260502-003"></textarea>
                <button class="print-btn" onclick="batchImport()">批次匯入並列印</button>
                <div id="batchStatus" style="font-size:11px;color:rgba(232,224,208,0.4);min-height:16px;"></div>
            </div>
        </div>

        <div class="print-note">
            列印設定：<br>
            • 紙張：A4 直式<br>
            • 邊距：無（或最小）<br>
            • <strong>雙面列印：長邊翻頁</strong><br>
            • 封面另以設計稿 PDF 列印<br>
            • 印完沿折線對折即完成<br><br>
            匯出 PDF：選「另存為 PDF」
        </div>
    </div>

    <!-- 右側：螢幕預覽 -->
    <div class="preview-panel" id="preview-panel">
        <div class="preview-label">內頁預覽（設計理念面，與封面背靠背列印）</div>
        <div id="scale-wrap">
            <!-- 螢幕預覽使用同一份 print-sheet 模板 -->
            <div class="print-sheet" id="preview-sheet">
                <!-- 卡片 1 -->
                <div class="card-inner card-1">
                    <div class="fold-guide"></div>
                    <div class="cut tl"></div>
                    <div class="cut tr"></div>
                    <div class="cut bl"></div>
                    <div class="cut br"></div>
                    <div class="card-text" id="preview-text-1"></div>
                </div>
                <!-- 卡片 2 -->
                <div class="card-inner card-2">
                    <div class="fold-guide"></div>
                    <div class="cut tl"></div>
                    <div class="cut tr"></div>
                    <div class="cut bl"></div>
                    <div class="cut br"></div>
                    <div class="card-text" id="preview-text-2"></div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- 列印專用容器（螢幕隱藏，列印時顯示） -->
<div id="print-container" style="display:none;">
    <div class="print-sheet">
        <div class="card-inner card-1">
            <div class="cut tl"></div>
            <div class="cut tr"></div>
            <div class="cut bl"></div>
            <div class="cut br"></div>
            <div class="card-text" id="print-text-1"></div>
        </div>
        <div class="card-inner card-2">
            <div class="cut tl"></div>
            <div class="cut tr"></div>
            <div class="cut bl"></div>
            <div class="cut br"></div>
            <div class="card-text" id="print-text-2"></div>
        </div>
    </div>
</div>

<!-- 批次列印容器（螢幕隱藏，列印時顯示） -->
<div id="batch-container"></div>

<script>
const storyInput = document.getElementById('story-input');
const charCountEl = document.getElementById('char-count');

async function importOrder() {
    const orderId = document.getElementById('order-id-input').value.trim();
    const statusEl = document.getElementById('import-status');
    if (!orderId) { statusEl.textContent = '請輸入訂單編號'; return; }

    statusEl.textContent = '載入中...';
    try {
        const res = await fetch(`${window.BACKEND_URL}/api/order/${encodeURIComponent(orderId)}`);
        const data = await res.json();
        if (!data.success) { statusEl.textContent = '找不到此訂單'; return; }

        const order = data.order;
        const story = order.finalDesignStory || order.design_story ||
            (order.items && order.items[0] && order.items[0].designStory) || '';
        if (!story) { statusEl.textContent = '此訂單尚無設計理念'; return; }

        storyInput.value = story;
        updateCards();
        statusEl.textContent = `已匯入（${story.length} 字）`;
    } catch {
        statusEl.textContent = '網路錯誤，請稍後再試';
    }
}

/* 將純文字轉為 HTML（段落 + 簽名線） */
function buildCardHTML(text) {
    const trimmed = text.trim();
    if (!trimmed) return '';

    const paras = trimmed.split(/\n+/).filter(p => p.trim());
    const parasHTML = paras.map(p =>
        `<p>${p.trim().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>`
    ).join('');

    const sigHTML = `<div class="sig-block"><span class="sig-line"></span></div>`;
    return parasHTML + sigHTML;
}

/* 更新所有卡片文字 */
function updateCards() {
    const html = buildCardHTML(storyInput.value);
    charCountEl.textContent = storyInput.value.length;
    ['preview-text-1', 'preview-text-2', 'print-text-1', 'print-text-2'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = html;
    });
}

/* 縮放螢幕預覽以符合可用寬度 */
function scalePreview() {
    const panel = document.getElementById('preview-panel');
    const availW = panel.clientWidth - 56;
    const sheetPxW = 210 * 3.7795; // A4 直式寬度 ≈ 794px
    const sheetPxH = 297 * 3.7795; // A4 直式高度 ≈ 1122px
    const scale = Math.min(1, availW / sheetPxW);
    const wrap = document.getElementById('scale-wrap');
    wrap.style.transform = `scale(${scale})`;
    wrap.style.transformOrigin = 'top center';
    wrap.style.marginBottom = `${sheetPxH * (scale - 1)}px`;
}

/* 列印前：顯示列印容器 */
let _batchMode = false;
window.onbeforeprint = function () {
    if (_batchMode) return; // 批次模式：batch-container 已顯示
    document.getElementById('print-container').style.display = 'block';
};

/* 列印後：隱藏列印容器，重置輸入欄位 */
window.onafterprint = function () {
    if (_batchMode) {
        document.getElementById('batch-container').innerHTML = '';
        _batchMode = false;
        return;
    }
    document.getElementById('print-container').style.display = 'none';
    storyInput.value = '';
    updateCards();
};

/* ── 批次模式切換 ── */
function toggleBatchMode() {
    const btn = document.getElementById('batchToggleBtn');
    const section = document.getElementById('batchSection');
    const isVisible = section.classList.contains('visible');
    section.classList.toggle('visible', !isVisible);
    btn.classList.toggle('active', !isVisible);
}

/* ── 批次列印主函數 ── */
async function batchImport() {
    const statusEl = document.getElementById('batchStatus');
    const lines = document.getElementById('batchInput').value
        .split('\n').map(l => l.trim()).filter(Boolean);

    if (lines.length === 0) { statusEl.textContent = '請輸入至少一筆訂單編號'; return; }

    statusEl.textContent = `載入 ${lines.length} 筆訂單中...`;

    // 並行 fetch 所有訂單
    const results = await Promise.all(lines.map(async id => {
        try {
            const res = await fetch(`${window.BACKEND_URL}/api/order/${encodeURIComponent(id)}`);
            const data = await res.json();
            if (data.success) return { id, order: data.order };
            return { id, error: '找不到此訂單' };
        } catch {
            return { id, error: '網路錯誤' };
        }
    }));

    const ok = results.filter(r => r.order);
    const failed = results.filter(r => r.error);
    if (failed.length > 0) {
        const msg = failed.map(r => `${r.id}: ${r.error}`).join('、');
        statusEl.textContent = `${ok.length} 筆成功，${failed.length} 筆失敗（${msg}）`;
        if (ok.length === 0) return;
    } else {
        statusEl.textContent = `已載入 ${ok.length} 筆訂單，準備列印...`;
    }

    // 建立批次列印 HTML
    const container = document.getElementById('batch-container');
    container.innerHTML = '';

    // 每 2 筆訂單 = 1 對頁（Cover 頁 + Story 頁）
    for (let i = 0; i < ok.length; i += 2) {
        const o1 = ok[i];
        const o2 = ok[i + 1] || null;

        // 奇數頁：Cover_N | Cover_N+1
        const coverPage = document.createElement('div');
        coverPage.className = 'batch-page';
        coverPage.appendChild(buildSlot('cover', o1, 'slot-left'));
        if (o2) coverPage.appendChild(buildSlot('cover', o2, 'slot-right'));
        container.appendChild(coverPage);

        // 偶數頁：Story_N | Story_N+1
        const storyPage = document.createElement('div');
        storyPage.className = 'batch-page';
        storyPage.appendChild(buildSlot('story', o1, 'slot-left'));
        if (o2) storyPage.appendChild(buildSlot('story', o2, 'slot-right'));
        container.appendChild(storyPage);
    }

    _batchMode = true;
    setTimeout(() => window.print(), 200);
}

function buildSlot(type, result, slotClass) {
    const wrapper = document.createElement('div');
    wrapper.className = `batch-slot ${slotClass}`;

    const order = result.order;
    // 解析 order.items[0] 取得字母/材質
    const item = (order.items && order.items[0]) || {};
    const userInfo = order.userInfo || {};
    const letter1 = item.letter1 || item.Letter1 || '';
    const letter2 = item.letter2 || item.Letter2 || '';
    const lettersDisplay = (letter1 && letter2) ? `${letter1} × ${letter2}` : (letter1 || letter2 || '—');
    const material = item.material || item.Material || '';
    const name = userInfo.name || userInfo.firstName || '';
    const email = userInfo.email || '';
    const dateStr = order.timestamp
        ? new Date(order.timestamp).toLocaleDateString('zh-TW')
        : (order.created_at ? new Date(order.created_at).toLocaleDateString('zh-TW') : '');

    if (type === 'cover') {
        wrapper.innerHTML = `
            <div class="cover-card">
                <div class="cover-brand">DUET</div>
                <div class="cover-letters">${lettersDisplay}</div>
                <div class="cover-divider"></div>
                <div class="cover-meta">
                    ${name ? name + '<br>' : ''}
                    ${result.id}<br>
                    ${dateStr}
                </div>
            </div>`;
    } else {
        const story = order.finalDesignStory || order.design_story ||
            (item.designStory) || (item.design_story) || '';
        const parasHTML = story.trim()
            ? story.trim().split(/\n+/).filter(p => p.trim())
                .map(p => `<p>${p.trim().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>`)
                .join('')
            : '<p style="color:#aaa;font-size:3.2mm;">（尚無設計理念）</p>';
        wrapper.innerHTML = `
            <div class="story-card">
                <div class="story-header">${result.id}${lettersDisplay ? ' · ' + lettersDisplay : ''}</div>
                <div class="story-text">${parasHTML}</div>
                <div class="story-sig"><span class="story-sig-line"></span></div>
            </div>`;
    }
    return wrapper;
}

storyInput.addEventListener('input', updateCards);
window.addEventListener('resize', scalePreview);

/* 初始化 */
updateCards();
scalePreview();

if (window !== window.top) {
    document.querySelector('.app-header').style.display = 'none';
    document.querySelector('.app-layout').style.height = '100vh';
}
