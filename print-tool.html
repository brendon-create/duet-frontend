<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設計理念列印工具 | DUET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Caveat:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── 全域 reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ────────────────────────────────────────────
   螢幕 UI
──────────────────────────────────────────── */
body {
    font-family: 'Noto Serif TC', serif;
    background: #1a1814;
    color: #e8e0d0;
    min-height: 100vh;
}

.app-header {
    padding: 20px 32px;
    border-bottom: 1px solid rgba(212,175,55,0.2);
    display: flex;
    align-items: baseline;
    gap: 16px;
}
.app-header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 400;
    color: #d4af37;
    letter-spacing: 2px;
}
.app-header span {
    font-size: 12px;
    color: rgba(232,224,208,0.45);
    letter-spacing: 1px;
}

.app-layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    height: calc(100vh - 65px);
}

/* 左側輸入面板 */
.input-panel {
    padding: 28px 24px;
    border-right: 1px solid rgba(255,255,255,0.07);
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
}
.input-panel label {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: rgba(232,224,208,0.45);
    text-transform: uppercase;
    display: block;
    margin-bottom: 8px;
}
.input-panel textarea {
    width: 100%;
    height: 260px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 14px;
    color: #e8e0d0;
    font-family: 'Noto Serif TC', serif;
    font-size: 13px;
    line-height: 1.8;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
}
.input-panel textarea:focus { border-color: rgba(212,175,55,0.35); }

.char-count {
    font-size: 11px;
    color: rgba(232,224,208,0.3);
    text-align: right;
    margin-top: -12px;
}
.layout-hint {
    font-size: 11px;
    color: rgba(212,175,55,0.7);
    padding: 10px 12px;
    background: rgba(212,175,55,0.06);
    border: 1px solid rgba(212,175,55,0.15);
    border-radius: 8px;
    line-height: 1.6;
}
.print-btn {
    background: linear-gradient(135deg, #d4af37, #aa8a2e);
    border: none;
    color: #1a1814;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    transition: opacity 0.2s;
}
.print-btn:hover { opacity: 0.88; }
.print-note {
    font-size: 11px;
    color: rgba(232,224,208,0.35);
    line-height: 1.8;
    padding-top: 4px;
}

/* 右側預覽面板 */
.preview-panel {
    overflow: auto;
    background: #111009;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 24px;
    gap: 12px;
}
.preview-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(212,175,55,0.5);
    text-transform: uppercase;
    align-self: flex-start;
}

/* 縮放包裝 (transform-origin = top center) */
#scale-wrap {
    transform-origin: top center;
}

/* ────────────────────────────────────────────
   卡片版面（螢幕預覽 & 列印共用）

   規格：
     A4 直式  210mm × 297mm
     每張 2 個卡片內頁
     每個展開  180mm × 110mm（左右各 90mm）
     左邊距    15mm  = (210-180)/2
     card-1 top 25.67mm = (297-220)/3
     card-2 top 161.33mm = 25.67+110+25.67
     文字區各半邊距折線 6mm、距切割邊 6mm
──────────────────────────────────────────── */
.print-sheet {
    width: 210mm;
    height: 297mm;
    position: relative;
    background: white;
    overflow: visible; /* 讓裁切角標可溢出 */
}

/* 每個卡片展開 */
.card-inner {
    position: absolute;
    width: 180mm;
    height: 110mm;
    left: 15mm;
    overflow: hidden;
}
.card-inner.card-1 { top: 25.67mm; }
.card-inner.card-2 { top: 161.33mm; }

/* 折疊虛線（僅螢幕顯示） */
.fold-guide {
    position: absolute;
    left: 90mm;
    top: 0; bottom: 0;
    width: 0;
    border-left: 0.5pt dashed rgba(100,92,82,0.3);
    pointer-events: none;
}

/* 裁切角標 */
.cut {
    position: absolute;
    width: 5mm; height: 5mm;
    border-color: #999;
    border-style: solid;
    border-width: 0;
    /* 溢出卡片邊界 2mm */
}
.cut.tl { top: -2mm;    left: -2mm;    border-top-width: 0.4pt;    border-left-width: 0.4pt;  }
.cut.tr { top: -2mm;    right: -2mm;   border-top-width: 0.4pt;    border-right-width: 0.4pt; }
.cut.bl { bottom: -2mm; left: -2mm;    border-bottom-width: 0.4pt; border-left-width: 0.4pt;  }
.cut.br { bottom: -2mm; right: -2mm;   border-bottom-width: 0.4pt; border-right-width: 0.4pt; }

/* ── 文字區（CSS 雙欄，自動從左欄流入右欄）──
   總文字寬：180-6-6 = 168mm
   欄間距（折線兩側各 6mm）：12mm
   每欄寬：(168-12)/2 = 78mm
   容器高：110-8-6 = 96mm
   簽名佔：17mm(margin)+1mm(線) = 18mm
   文字可用：96-18 = 78mm → 行高 8.3mm → 9.4 行 → 精準 9 行
*/
.card-text {
    position: absolute;
    left: 6mm;
    right: 6mm;
    top: 8mm;
    bottom: 6mm;
    columns: 2;
    column-gap: 12mm;
    column-fill: auto;
    font-family: 'Ma Shan Zheng', 'Caveat', 'Noto Serif TC', serif;
    font-size: 4.5mm;
    line-height: 1.65;
    color: #2e2a24;
    text-align: justify;
    overflow: hidden;
    orphans: 2;
    widows: 2;
}

/* 段落間距 */
.card-text p {
    margin-bottom: 0.55em;
    break-inside: avoid;
}
.card-text p:last-of-type { margin-bottom: 0; }

/* 簽名區：在文字流末端，右對齊紅線
   margin-top: 17mm = 2 行視覺距離（行高 8.3mm × 2 ≈ 16.6mm）
*/
.sig-block {
    break-inside: avoid;
    break-before: avoid;
    margin-top: 17mm;
    text-align: right;
}
.sig-line {
    display: inline-block;
    width: 38mm;
    border-bottom: 0.5pt solid #c0392b;
    vertical-align: bottom;
}

/* ────────────────────────────────────────────
   列印樣式
──────────────────────────────────────────── */
@media print {
    @page { size: 210mm 297mm; margin: 0; }

    /* 螢幕 UI 全部隱藏 */
    .app-header,
    .app-layout { display: none !important; }

    /* 列印時 print-sheet 以原始尺寸輸出 */
    #print-container {
        display: block !important;
        position: fixed;
        top: 0; left: 0;
        width: 210mm;
        height: 297mm;
    }

    .print-sheet {
        transform: none !important;
        width: 210mm;
        height: 297mm;
    }

    /* 折疊虛線列印時隱藏 */
    .fold-guide { display: none !important; }

    /* 螢幕預覽縮放包裝：取消 transform */
    #scale-wrap { transform: none !important; }
}
</style>
</head>
<body>

<div class="app-header">
    <h1>DUET</h1>
    <span>設計理念列印工具 / Design Story Print Tool</span>
</div>

<div class="app-layout">

    <!-- 左側：輸入面板 -->
    <div class="input-panel">
        <div>
            <label>設計理念（貼入文字）</label>
            <textarea id="story-input" placeholder="在此貼入設計理念文字...

文字會自動從左欄填滿後流入右欄。
左欄為打開卡片後正面（封面內側），
右欄為背面內側。"></textarea>
            <div class="char-count"><span id="char-count">0</span> 字</div>
        </div>

        <div class="layout-hint">
            📄 雙欄排版 · 左欄優先，自動流入右欄<br>
            ✍️ 簽名線自動出現在文字末尾
        </div>

        <button class="print-btn" onclick="window.print()">列印 / 匯出 PDF</button>

        <div class="print-note">
            列印設定：<br>
            • 紙張：A4 直式<br>
            • 邊距：無（或最小）<br>
            • <strong>雙面列印：長邊翻頁</strong><br>
            • 封面另以設計稿 PDF 列印<br>
            • 印完沿折線對折即完成<br><br>
            匯出 PDF：選「另存為 PDF」
        </div>
    </div>

    <!-- 右側：螢幕預覽 -->
    <div class="preview-panel" id="preview-panel">
        <div class="preview-label">內頁預覽（設計理念面，與封面背靠背列印）</div>
        <div id="scale-wrap">
            <!-- 螢幕預覽使用同一份 print-sheet 模板 -->
            <div class="print-sheet" id="preview-sheet">
                <!-- 卡片 1 -->
                <div class="card-inner card-1">
                    <div class="fold-guide"></div>
                    <div class="cut tl"></div>
                    <div class="cut tr"></div>
                    <div class="cut bl"></div>
                    <div class="cut br"></div>
                    <div class="card-text" id="preview-text-1"></div>
                </div>
                <!-- 卡片 2 -->
                <div class="card-inner card-2">
                    <div class="fold-guide"></div>
                    <div class="cut tl"></div>
                    <div class="cut tr"></div>
                    <div class="cut bl"></div>
                    <div class="cut br"></div>
                    <div class="card-text" id="preview-text-2"></div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- 列印專用容器（螢幕隱藏，列印時顯示） -->
<div id="print-container" style="display:none;">
    <div class="print-sheet">
        <div class="card-inner card-1">
            <div class="cut tl"></div>
            <div class="cut tr"></div>
            <div class="cut bl"></div>
            <div class="cut br"></div>
            <div class="card-text" id="print-text-1"></div>
        </div>
        <div class="card-inner card-2">
            <div class="cut tl"></div>
            <div class="cut tr"></div>
            <div class="cut bl"></div>
            <div class="cut br"></div>
            <div class="card-text" id="print-text-2"></div>
        </div>
    </div>
</div>

<script>
const storyInput = document.getElementById('story-input');
const charCountEl = document.getElementById('char-count');

/* 將純文字轉為 HTML（段落 + 簽名線） */
function buildCardHTML(text) {
    const trimmed = text.trim();
    if (!trimmed) return '';

    const paras = trimmed.split(/\n+/).filter(p => p.trim());
    const parasHTML = paras.map(p =>
        `<p>${p.trim().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>`
    ).join('');

    const sigHTML = `<div class="sig-block"><span class="sig-line"></span></div>`;
    return parasHTML + sigHTML;
}

/* 更新所有卡片文字 */
function updateCards() {
    const html = buildCardHTML(storyInput.value);
    charCountEl.textContent = storyInput.value.length;
    ['preview-text-1', 'preview-text-2', 'print-text-1', 'print-text-2'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = html;
    });
}

/* 縮放螢幕預覽以符合可用寬度 */
function scalePreview() {
    const panel = document.getElementById('preview-panel');
    const availW = panel.clientWidth - 56;
    const sheetPxW = 210 * 3.7795; // A4 直式寬度 ≈ 794px
    const sheetPxH = 297 * 3.7795; // A4 直式高度 ≈ 1122px
    const scale = Math.min(1, availW / sheetPxW);
    const wrap = document.getElementById('scale-wrap');
    wrap.style.transform = `scale(${scale})`;
    wrap.style.transformOrigin = 'top center';
    wrap.style.marginBottom = `${sheetPxH * (scale - 1)}px`;
}

/* 列印前：顯示列印容器 */
window.onbeforeprint = function () {
    document.getElementById('print-container').style.display = 'block';
};

/* 列印後：隱藏列印容器，重置輸入欄位 */
window.onafterprint = function () {
    document.getElementById('print-container').style.display = 'none';
    storyInput.value = '';
    updateCards();
};

storyInput.addEventListener('input', updateCards);
window.addEventListener('resize', scalePreview);

/* 初始化 */
updateCards();
scalePreview();
</script>
</body>
</html>
