<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- Meta Pixel -->
    <script src="assets/js/meta-pixel.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUET - 分享您的感受</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 44px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            color: #d4af37;
            font-size: 36px;
            font-weight: 600;
            letter-spacing: 4px;
        }

        .header p {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        .order-id {
            background: #f9f9f9;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 28px;
            text-align: center;
        }

        .order-id label {
            font-size: 12px;
            color: #aaa;
            display: block;
            margin-bottom: 4px;
        }

        .order-id span {
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }

        /* 星星評分 */
        .rating-section {
            margin-bottom: 28px;
            text-align: center;
        }

        .rating-section h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .stars {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .star {
            font-size: 40px;
            cursor: pointer;
            color: #ddd;
            transition: all 0.2s ease;
            user-select: none;
        }

        .star:hover,
        .star.active {
            color: #d4af37;
            transform: scale(1.1);
        }

        .star.selected {
            color: #d4af37;
        }

        /* 選填問題區塊 */
        .optional-note {
            font-size: 13px;
            color: #aaa;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .questions {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 28px;
        }

        .question-block label {
            display: block;
            font-size: 14px;
            color: #444;
            font-weight: 500;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .question-block textarea {
            width: 100%;
            min-height: 72px;
            padding: 12px 14px;
            border: 1.5px solid #eee;
            border-radius: 12px;
            font-family: 'Outfit', 'Microsoft JhengHei', Arial, sans-serif;
            font-size: 14px;
            color: #333;
            resize: vertical;
            transition: border-color 0.2s ease;
            line-height: 1.6;
        }

        .question-block textarea:focus {
            outline: none;
            border-color: #d4af37;
        }

        .question-block textarea::placeholder {
            color: #ccc;
        }

        .btn-submit {
            width: 100%;
            padding: 17px;
            background: linear-gradient(135deg, #d4af37 0%, #b8962e 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 成功畫面 */
        .success-message {
            text-align: center;
            padding: 40px 20px;
        }

        .success-message .checkmark {
            font-size: 56px;
            margin-bottom: 20px;
        }

        .success-message h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .success-message p {
            color: #888;
            font-size: 15px;
            line-height: 1.7;
        }

        .thank-you-link {
            display: inline-block;
            margin-top: 28px;
            color: #d4af37;
            text-decoration: none;
            font-size: 14px;
        }

        .thank-you-link:hover {
            text-decoration: underline;
        }

        .divider {
            border: none;
            border-top: 1px solid #f0f0f0;
            margin: 4px 0 20px 0;
        }
    </style>
</head>
<body>
<noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=2611432972696612&ev=PageView&noscript=1" /></noscript>
    <div class="container" id="feedbackForm">
        <div class="header">
            <h1>DUET</h1>
            <p>BCAG JEWELRY</p>
        </div>

        <div class="order-id">
            <label>訂單編號</label>
            <span id="orderIdDisplay">載入中...</span>
        </div>

        <!-- 星星評分（必填） -->
        <div class="rating-section">
            <h2>整體滿意度</h2>
            <div class="stars">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
        </div>

        <hr class="divider">

        <!-- 選填問題 -->
        <p class="optional-note">以下問題皆為選填，填幾題都可以，或直接送出也沒關係。</p>

        <div class="questions">
            <div class="question-block">
                <label>收到作品的第一個感受是什麼？</label>
                <textarea id="q1" placeholder="例：比想像中更精緻"></textarea>
            </div>

            <div class="question-block">
                <label>如果是作為禮物——對方收到的那一刻，是什麼反應？</label>
                <textarea id="q2" placeholder="例：她戴上之後就不想拿下來了"></textarea>
            </div>

            <div class="question-block">
                <label>整個訂製過程的體驗如何？</label>
                <textarea id="q3" placeholder="例：AI 設計的過程很有趣"></textarea>
            </div>

            <div class="question-block">
                <label>有什麼我們下次可以做得更好的？</label>
                <textarea id="q4" placeholder="任何建議都歡迎"></textarea>
            </div>
        </div>

        <button class="btn-submit" id="submitBtn" onclick="submitFeedback()">送出</button>
    </div>

    <div class="container" id="successMessage" style="display: none;">
        <div class="success-message">
            <div class="checkmark">✨</div>
            <h2>謝謝你的分享</h2>
            <p>每一則回饋，都幫助我們做得更好。<br>很高興能成為你們故事的一部分。</p>
            <a href="https://duet.brendonchen.com" class="thank-you-link">← 回到 DUET</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order') || '';

        // 環境切換
        const env = urlParams.get('env');
        if (env === 'staging') {
            window.BACKEND_URL = 'https://duet-backend-staging-ye5v.onrender.com';
        } else {
            window.BACKEND_URL = 'https://duet-backend-wlw8.onrender.com';
        }

        document.getElementById('orderIdDisplay').textContent = orderId || '未指定';

        let selectedRating = 0;

        const stars = document.querySelectorAll('.star');
        stars.forEach(star => {
            star.addEventListener('click', function() {
                selectedRating = parseInt(this.dataset.value);
                updateStars();
            });
            star.addEventListener('mouseover', function() {
                highlightStars(parseInt(this.dataset.value));
            });
            star.addEventListener('mouseout', function() {
                updateStars();
            });
        });

        function highlightStars(max) {
            stars.forEach((s, i) => s.classList.toggle('active', i < max));
        }

        function updateStars() {
            stars.forEach((s, i) => s.classList.toggle('selected', i < selectedRating));
        }

        async function submitFeedback() {
            if (selectedRating === 0) {
                alert('請選擇整體滿意度');
                return;
            }

            // 把四個問題合併成有結構的 comment 字串
            const answers = [
                { label: '收到作品的感受', id: 'q1' },
                { label: '送禮的反應',     id: 'q2' },
                { label: '訂製體驗',       id: 'q3' },
                { label: '改善建議',       id: 'q4' },
            ];
            const parts = answers
                .map(a => ({ label: a.label, val: document.getElementById(a.id).value.trim() }))
                .filter(a => a.val)
                .map(a => `【${a.label}】${a.val}`);
            const comment = parts.join('\n');

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '送出中...';

            try {
                const response = await fetch(window.BACKEND_URL + '/api/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId, rating: selectedRating, comment })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('feedbackForm').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                } else {
                    alert(data.error || '提交失敗，請稍後重試');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '送出';
                }
            } catch (error) {
                console.error('提交錯誤:', error);
                alert('網路錯誤，請稍後重試');
                submitBtn.disabled = false;
                submitBtn.textContent = '送出';
            }
        }
    </script>
</body>
</html>
