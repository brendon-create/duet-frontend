<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>設計理念投票</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--fg:#26241f;--mut:#7a766c;--line:#e3dfd5;--acc:#a8842c;--acc-bg:#f6efdc;--ok:#3d7a4a}
@media (prefers-color-scheme:dark){:root{--bg:#141418;--card:#1f1f25;--fg:#ebe8e1;--mut:#9b978d;--line:#34333b;--acc:#d4af37;--acc-bg:#2c2716;--ok:#7fc28f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:1500px;margin:0 auto;padding:28px 16px 120px}
h1{font-size:22px;margin:0 0 8px}
.intro{color:var(--mut);font-size:15px;margin:0 0 16px}
.note{background:var(--acc-bg);border-left:3px solid var(--acc);border-radius:8px;padding:10px 14px;margin:0 0 16px;font-size:15px}
.name{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.name input{flex:1;min-width:180px;max-width:280px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px;margin:22px 0}
.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
h2{font-size:17px;margin:0}
.ctx{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
@media (min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}
button.ver{all:unset;box-sizing:border-box;display:block;cursor:pointer;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);transition:border-color .15s,background .15s}
button.ver:hover{border-color:var(--acc)}
button.ver:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.ver[aria-checked="true"]{border-color:var(--acc);background:var(--acc-bg)}
.tag{font-weight:600;color:var(--acc);font-size:14px;display:flex;justify-content:space-between}
.tag .pick{display:none}
button.ver[aria-checked="true"] .pick{display:inline}
.txt{white-space:pre-wrap;margin-top:6px;font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px}
.bar-in{max-width:1500px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.count{font-size:15px}
.msg{font-size:14px;color:var(--mut)}
.msg.ok{color:var(--ok)}
#submit{all:unset;cursor:pointer;background:var(--acc);color:#fff;font-weight:600;padding:10px 22px;border-radius:999px}
#submit[disabled]{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<main>
  <h1>DUET 設計理念投票</h1>
  <p class="intro">每一件作品下面有幾個版本的「設計理念」，是附在作品裡、送禮者寫給收禮者的卡片文字。請想像你就是送禮者，選出你最想放進卡片的那一篇。每件作品只能選一個，不用全部投完也可以送出；送出後還能修改再送一次，會以最後一次為準。</p>
  <p class="note"><b>請注意：每件作品的四個版本都是隨機排列的，A、B、C、D 這些字母本身沒有任何意義。</b>每件作品請只看內容，選出你最喜歡的那一篇就好。</p>
  <div class="name">
    <label for="name">你的暱稱（選填）</label>
    <input id="name" maxlength="30" placeholder="方便我們知道是誰投的">
  </div>
  <div id="cases"></div>
</main>
<div class="bar"><div class="bar-in">
  <div><div class="count" id="count"></div><div class="msg" id="msg"></div></div>
  <button id="submit" type="button">送出投票</button>
</div></div>

<script>
const CASES = [{"id": "c01", "context": "送給老婆｜結婚週年", "letters": "D + A", "versions": {"old": "D 和 A，是我們各自名字的開頭，放在一起，就是這些年的樣子。三個孩子，沒有任何後援，你和我一起扛過來的。\n\n你的字母，我選了線條柔順、低調有質感的字形——像你這個人：善良正直，卻從不張揚。我的字母，同樣的質感，沉穩一點，是我在你身邊的方式。兩個字放在一起，不爭，也不散。\n\n這些年謝謝你。往後的日子，我們繼續。", "sonnet": "三個孩子，沒有任何後援，這些年就是我們兩個人互相扶持撐過來的。很多事我不常說出口，但到了週年紀念這天，想讓妳知道：這些年的辛苦，我都記得，也都感謝。\n\nD 是我名字的開頭，A 是妳的，兩個字母交織在一起，就是我和妳。字體柔順低調、有質感，戴起來不浮誇，就像妳一直給我的感覺。\n\n結婚週年快樂。謝謝妳，也期待我們接下來的日子。", "sonnet55": "老婆，結婚週年快樂。\n\n三個孩子，沒有任何後援，我們兩個人只能互相扶持，才把這個家顧好。這些日子謝謝妳，一路都在我身邊。\n\nD 是我，A 是妳，兩個字母交織在一起，就像我們這些年過的日子。字體柔順、低調，戴起來有質感又不浮誇，我覺得很像妳。\n\n謝謝妳走到現在，接下來的日子，我也很期待。", "opus": "結婚週年快樂。這些年我們一起養三個小孩，身邊沒有任何後援，只能靠我們兩個人互相扶持、互相幫忙，才把這個家顧好。看著妳對孩子那麼有愛心、那麼有耐性，我心裡一直很感謝。\n\nD 是我，A 是妳，兩個字母交織在一起，就像我們這些年一起走過來的樣子。我選的字體看起來柔順、低調有質感，就像妳，有氣質，不浮誇。\n\n謝謝妳這些日子的付出。接下來的日子，我們繼續一起過簡單的生活，我很期待。"}}, {"id": "c02", "context": "送給老婆｜生日", "letters": "B + b", "versions": {"old": "B 和 b，是我們的名字。聖誕節認識的，這件事我一直記得。\n\n你的 b，我選了一個筆觸流動、低調卻有重量的字形——你自主、獨立、一直在學新的東西，這個字形沒有多餘的裝飾，氣質卻很清楚。我的 B，同樣的字形，因為我們是一樣的人，只是大小不同。\n\n生日快到了。我愛你。", "sonnet": "從聖誕節那天認識妳，到現在，我一直覺得我們很像——都是那種走自己的路、永遠在學新東西的人。也許就是因為這樣，我們放在一起才剛剛好。\n\nB 和 b，是我們兩個的名字，交織在一起。線條流動、低調，我覺得很像妳。\n\n生日快樂。我愛妳。", "sonnet55": "老婆，生日快樂。\n\nB 是我，b 是妳，是我們各自的英文名字。把兩個字母交織在一起，就像我們兩個人，各自獨立，又走在同一條路上。\n\n我們是在聖誕節認識的，那一天，我很慶幸。妳自主、獨立、好學，一直是我欣賞的樣子。這個墜飾的字體流動、帶著手寫的溫柔，低調地戴在身上，就很有妳的味道。\n\n我愛妳。", "opus": "我們是在聖誕節認識的。從那天到現在，我最欣賞的，一直是妳的自主、獨立、好學。剛好，我也是這樣的人，所以我們能一起走到現在。\n\n大寫的 B 是我，小寫的 b 是妳。兩個字母用帶著手寫感、浪漫流動的線條交織在一起。我想要低調一點的樣子，就像我們，不用張揚，在一起就很好。\n\n生日快到了，老婆，生日快樂，我愛妳。"}}, {"id": "c03", "context": "送給老婆", "letters": "T + W", "versions": {"old": "T 和 W，是我們兩個人的縮寫，放在同一件作品裡。\n\n兩個字母用的是同一種字體。W 的字形少見，我選它，是因為它本身就有你的樣子：不是常見的那種端正，而是有自己的結構，看起來沉穩，仔細看才知道線條裡有一種分寸感——公平、有智慧，認真付出這件事從來不需要聲張。T 的字形也是這樣，低調，有份量，是我希望站在你身邊的那個樣子。\n\n謝謝你這些年的認真。戴著它，就是我說的話。", "sonnet": "T 是 Tony，W 是 Wendy，兩個名字交織在同一件作品裡，我想讓妳戴著它的時候知道——我們是在一起的。\n\n妳認真付出的樣子，我都看在眼裡。這份感謝，我一直放在心裡，只是說得不夠多。\n\n字型特別挑了少見的，優雅輕透，低調耐看，我覺得適合妳。謝謝妳，希望我們一起幸福。", "sonnet55": "老婆，T 是 Tony，W 是 Wendy，我把我們兩個人的名字放在同一件作品裡，交織在一起。\n\n妳處事公平，有智慧，也一直認真付出，這些我都看在眼裡。我們都善良，不與人交惡，能跟這樣的妳走在一起，是我的幸福。\n\n這個字體少見，優雅又輕盈，低調卻有自己的味道，我覺得很像妳。謝謝妳，老婆，我愛妳。", "opus": "T 是我，W 是妳，兩個字母放在一起，就是我們。\n\n妳的認真付出，我一直都看在眼裡。遇到事情，妳總是處理得公平又有智慧，這一點我真的很佩服。我們都是善良、不跟人結怨的人，能跟妳一起過日子，是我的福氣。\n\n這次特別挑了一款少見的字型，低調典雅，看起來輕盈又有質感，就像妳，不張揚，卻很特別。\n\n跟妳在一起，我很幸福。謝謝妳，老婆。"}}, {"id": "c04", "context": "送給男朋友", "letters": "Y + N", "versions": {"old": "Y 和 N，我的名字和你的。\n\n你的字母，我選了一個有弧度、帶流動感的字形——像你這個人給我的感覺，開朗又輕盈，走到哪裡都讓那個地方亮一點。我的字母，字形安靜些，沒有太多稜角，是我想站在你旁邊的樣子。\n\n我知道我不如你那樣外向。但每次一起出去旅行，我喜歡的就是這樣：你在我身邊，我在你身邊，去哪裡都好。戴著它，就是我一直在。", "sonnet": "你開朗，我內斂。你到哪裡都能讓氣氛變熱，我習慣安靜地陪在旁邊。就是這樣互補的兩個人，走到了一起。\n\n我愛你的方式可能不轟轟烈烈，但是踏實的——一直在，一直在乎。希望你戴著它的時候，能感覺得到。\n\nY 是我，字型溫暖又充滿能量；N 是你，字型流動而浪漫。兩個字交織在一起，就像我們一起出發去過的每個地方，也像我們這段關係——剛剛好。", "sonnet55": "你開朗樂天，我比較內向，我們沒有太多一樣的地方，反而是不一樣的地方，剛好把彼此補起來。Y 是我，N 是你，兩個字母交織在一起，就是我們。\n\n我最喜歡跟你一起出去玩、一起旅行。我想給你的愛不轟轟烈烈，是踏實的安心感，還有我很在乎你。\n\nY 的字看起來溫暖親切，帶一點天真，N 則流動又浪漫，像手寫的字。戴著它，就知道我一直在。", "opus": "我們的共通點不多，互補的地方倒是不少。我比較內向，你開朗又樂天，兩個這麼不一樣的人，就這樣走在一起了。\n\n我最喜歡跟你一起出去玩、一起旅行。我想給你的不是轟轟烈烈的愛，是很踏實的那種：讓你安心，也讓你知道我很在乎你。\n\nY 是我，N 是你，一個溫暖可愛，一個浪漫流動，兩個風格不同的字交織在一起，就像我們。以後也想繼續跟你到處走走，愛你。"}}, {"id": "c05", "context": "送給合作多年的朋友（兩個字母是她和她先生）", "letters": "W + J", "versions": {"old": "W 和 J，是妳和妳先生的縮寫。這件作品本來是送給妳的，但我想讓它同時裝得下妳們兩個人。\n\n妳的字母，我選了一個低調卻有設計感的字形——弧度在那裡，但不誇張，有一點柔，有一點藏著的東西，像妳這個人：溫柔善解人意，卻同時有著讓人意外的毅力。J 的字形沉穩、有份量，收得住，是我覺得在妳身旁應該有的樣子。\n\n合作好幾年，常常覺得，要是早一點認識就好了。說出來其實只是珍惜的另一種說法——還好終究是遇見了妳。", "sonnet": "合作這幾年，我有時會想，要是早一點認識妳就好了。\n\nW 是妳，J 是他，把這兩個字母交在一起，是我想到最適合送妳的禮物。字體低調有設計感，弧度不誇張——優雅，但不張揚，感覺就像妳。\n\n很高興，我們終究是相遇了。", "sonnet55": "合作了好幾年，我常有一種感覺：要是能早一點遇見妳就好了。但也正因為這樣，我更珍惜現在，很高興終究還是遇見了妳。\n\n妳的溫柔和善解人意，還有那份說不出口卻一直都在的毅力，我都看在眼裡。我們的想法又這麼契合，能和妳一起走過這些年，是我的幸運。\n\nW 和 J 是妳和先生名字的縮寫，交織在一起。這個設計低調卻有設計感，弧度也不誇張，戴在身上很自在，就像妳給人的感覺。", "opus": "我們一起合作了好幾年，想法常常很契合。回頭想想，竟然有種錯過的感覺。可是不管怎麼說，能遇見妳，我真的很高興。\n\n妳是一個很溫柔的人，做起事來卻很有毅力。這次選了 W 和 J，是妳和妳先生的縮寫。字我挑了低調卻有設計感的樣子，弧度也不會太誇張，就像妳給人的感覺：不張揚，但很有自己的味道。\n\n謝謝妳這些年的一路同行，也祝妳和先生一直好好的。"}}, {"id": "c06", "context": "送給自己｜生日", "letters": "Y + M", "versions": {"old": "兩個字母都是我的名字，也都是我想親手交回給自己的東西。這個生日，我決定把自己放在第一位。\n\nY 的字體，我選了一個流動的筆觸——線條有走向，卻不用力，就像同理別人時那種不強迫的溫柔，一直是我的方式。M 的字體延續同樣的流暢，卻多了一分從容的重量，是我想培養的那種對自己的信任。兩個字母接在一起，有一種話說完整了的感覺。\n\n八年了，我一邊被拉扯，一邊在練習站穩。這件作品是我給自己的承諾：不是等一切都結束了才開始好好愛自己，而是從現在就開始。戴上它，是我記得這件事的方式。", "sonnet": "把自己的名字刻成一件作品，送給現在的自己。\n\n我知道自己習慣先同理別人、把別人放在前面。這樣的我，沒有什麼不好——只是這一次，我想把這份溫柔也留一點給自己。關注自己的身體，照顧自己的心情，一步一步學著跟自己和解。\n\nY 和 M 兩個字母流動在一起，就是我想給自己的那種感覺。希望每次戴上它，都能提醒自己：要有勇氣，也要有自信。生日快樂，我。", "sonnet55": "生日快樂。過去的我總是先考量別人的心情和處境，把自己擺在第二位。能先同理別人，是我喜歡自己的地方，但從今以後，我要多關注自己，身心都要健康。\n\nY 和 M，是我的名字。把它們交織在一起，是我送給自己的承諾：更愛自己，不管未來面對什麼事，都能跟自己和解。兩個字體連在一起很有流暢感，我希望自己往後的日子也能這樣順順地走。\n\n戴上它，我要有滿滿的勇氣與自信。這一年，我會好好照顧自己。", "opus": "過去的我，總是先考量別人的心情和處境，總是把自己擺在第二位。不管面對什麼事都能先同理別人，這是我很喜歡自己的地方。但從這個生日開始，我也想好好同理自己。\n\n所以我把自己的名字 Y 和 M 戴在身上。兩個字結合起來很有流暢感，柔和又自在，就像我希望往後的自己：不管未來面對什麼事情，都能跟自己和解。\n\n未來的我，要多關注自己，不論身心都要健康。每次戴上它，都提醒自己帶著滿滿的勇氣與自信往前走。生日快樂，我要更愛自己。"}}, {"id": "c07", "context": "送給老婆", "letters": "S + m", "versions": {"old": "S 和 m，是妳，也是我。\n\n妳的 S，我選了一個有分量卻不張揚的字形——端正裡有韌性，就像妳每天早起準備早餐、在三個男生中間撐起整個家，還能保持正向的樣子。m 的字形俐落沉穩，是我想給妳的那份踏實：不多說，但在。\n\n妳不需要什麼才能讓人覺得妳好看，這件事我一直看見。戴著它的時候，記得有人接得住妳。", "sonnet": "三個兒子，一個家，每天早起的是妳。我知道跟我們這幾個男生住在一起，有時候會覺得很難被理解。\n\n但我有看到妳。每天的早餐、每個默默撐下去的早晨——我都看到了。\n\nS 是妳，m 是我。S 的字體優雅穩重，m 直接有力，放在一起有點像我們兩個。把我們的名字交在一起，是因為我想讓妳知道：不管什麼時候，我都會接住妳。", "sonnet55": "這個墜飾是我們兩個名字的開頭，S 是妳，m 是我，交織在一起。\n\n每天早起叫三個兒子起床、準備早餐，在一屋子男生中間，有時候他們的想法連妳都無法理解。這些我一直有看到，也體會得到妳的辛苦。妳沒有心機，總是往好的地方想，這樣的妳讓這個家很溫暖。\n\nS 優雅精緻，是妳簡約又低調的樣子；m 堅定直接，是我想站在妳身邊的方式。戴著它，我會接住妳的踏實感。謝謝妳，老婆，我愛妳。", "opus": "每天早上，妳總是最早起來，叫小孩起床、準備早餐。家裡三個兒子，加上我，根本就是一間男生宿舍，我們男生的想法，有時候連妳都搞不懂。這些辛苦，我一直都有看到，也都放在心上。\n\nS 是妳，優雅又穩重，就像妳平常簡簡單單、不用化妝就很好看；m 是我，堅定、直接，想給妳一份踏實的感覺。我們兩個都喜歡低調，所以這份禮物也不張揚，戴在身上剛剛好。\n\n不管日子多忙多累，記得我會接住妳。老婆，謝謝妳為這個家的付出。"}}, {"id": "c08", "context": "送給太太", "letters": "D + J", "versions": {"old": "D 和 J 放在一起，是因為我們兩個人都在這裡。一起照顧孩子的那些時間，是我最清楚我們是一體的時候。\n\n字母 J 的字體纖細卻有骨氣，是妳做瑜伽也做重訓的那種質地——柔軟和力量同時存在。字母 D 的字體俐落直接，是我能給妳的樣子。\n\n謝謝妳，也謝謝妳愛我。", "sonnet": "D 是 David，J 是 Jenny——把我們兩個名字刻在一起，因為我想說的事就這麼簡單：謝謝妳，我愛妳。\n\n這幾年一起照顧孩子，有多少事情妳都扛著。妳對家人用心，對自己也有要求，讓我很佩服，也讓我很放心。D 的字體穩重俐落，J 的字體優雅精緻，我覺得放在一起很像我們兩個人的樣子。\n\n希望每次戴上它，都記得我說的這兩句話。", "sonnet55": "老婆，謝謝妳。這些年我們一起照顧小孩，也各自顧著事業，我知道這一路不輕鬆，但有妳在，我就覺得很踏實。\n\n妳善良、孝順，在事業上也做出了自己的成績。我們都很重視孩子，也都希望能替身邊的人帶來一點幸福。能跟妳一起往這個方向走，我很感謝。\n\nD 和 J 是 David 和 Jenny，兩個字母交織在一起。D 的線條俐落穩重，J 優雅精緻，我覺得看起來很好看，也很像妳。我愛妳。", "opus": "這份禮物，是想跟妳說兩件事：謝謝妳，還有我愛妳。\n\n這些年我們一起照顧小孩，也都在事業上努力，還想讓身邊的人過得幸福。這一路是我們兩個一起走過來的，有妳一起，我真的很感謝。\n\nD 和 J 是我們兩個。D 看起來簡單、穩重，像我想給妳的那份踏實；J 優雅又精緻，就像妳。兩個字母放在一起很好看，也很像我們。希望妳戴著它的時候，記得老公一直都在妳身邊。"}}, {"id": "c09", "context": "送給自己（沒有做諮詢對話）", "letters": "S + C", "versions": {"old": "這兩個字母是我的姓和我的名，放在一起就是完整的我。不是為了紀念什麼，是因為這樣的我值得被好好看見。\n\n兩個字母選了同一款字體，因為找到的時候就知道對了——那種筆觸不死板，有點隨性，卻有自己清楚的走法。跟著感覺走，但不是沒有方向。\n\n活出自己的樣子，這件事我一直在做。戴著它，繼續。", "sonnet": "把自己的姓和名交織在一起，因為我就是我，這樣已經夠了。\n\n選這個字體，是因為它的感覺跟我很像——不死板，活潑，跟著自己走。戴著 S 和 C，就是戴著自己。\n\n送給我自己。", "sonnet55": "S 是我的名字，C 是我的姓，我把它們交織在一起，戴在身上。這個我，就是完整的我。\n\n我喜歡這個字體，因為它就像我：不死板，活潑，跟著自己的個性走。看著它，我就想起自己本來的樣子。\n\n往後的日子，我也要這樣下去。", "opus": "S 是我的名字，C 是我的姓。把它們交織在一起，就是完完整整的我。\n\n這兩個字一看就覺得像我自己：不死板、活潑，帶著一點溫暖和可愛。我本來就是這樣的人，也喜歡這樣的自己。\n\n這是送給自己的禮物。以後戴著它，提醒自己：跟著自己的個性走就好。"}}, {"id": "c10", "context": "送給自己｜生日", "letters": "T + Y", "versions": {"old": "這件作品只刻了兩個字母，都是我自己名字的縮寫。不是紀念誰，不是送給誰——是我第一次認真為自己做一件事。\n\n兩個字體都是草寫，因為那是最像我的線條：看起來隨性，但每一筆都有方向。兒子說這兩個字看起來像中文字「可」，說是祝我百事可樂、天天開心——我把這個說法也一起帶進來了。\n\n外表搶眼，意義只有我知道。生日快樂，我自己。", "sonnet": "這兩個字母是我的名字縮寫，戴著就像帶著一個只有自己知道的秘密。外面的人看見的是一件有個性的飾品，裡面的意義只屬於我。\n\n草寫的字體是我自己挑的，因為比較符合我的個性。兒子說，這兩個字母看起來都有點像「可」，要祝媽媽百事可樂、天天開心——生日這天，這個祝福剛剛好。\n\n生日快樂，願好事一件接著一件。", "sonnet55": "我送給自己的生日禮物，是兩個字母：Y 和 T，我名字的縮寫。\n\n我一向喜歡有個性、鮮艷的顏色，也想要一眼就被注意到，又讓人想多看幾眼。這件墜飾戴在身上很搶眼，但裡面的意思只有我自己知道，那是我的小秘密。草寫的字體很像我，我也很喜歡。\n\n兒子說這兩個字看起來有點像中文的「可」，祝福我百事「可」樂、天天開心。生日快樂，我收下這份祝福，也祝自己天天開心。", "opus": "今年生日，送自己一份禮物。T 和 Y 是我名字的縮寫，這件作品從頭到尾都只屬於我。\n\n我喜歡有個性、鮮豔的顏色，戴上它，別人一眼就會注意到；但它真正的意義，只有我自己知道。選草寫，是因為草寫比較像我，Y 寫起來還多了一點溫暖、可愛。\n\n兒子說，這兩個字看起來都有點像中文的「可」，祝我百事可樂、天天開心。那就照他說的，生日快樂，願我每一天都百事可樂、天天開心！"}}, {"id": "c11", "context": "送給男友", "letters": "K + E", "versions": {"old": "K 和 E 放在一起，是你的名字和我的名字，也是我們兩個人在一起的樣子。廚房裡，兩個人一起煮飯，這就是我說的幸福。\n\nK 的字體有重量，穩穩的，不誇張——你永遠良善對人，就是這樣的份量。E 的字體線條俐落，不多餘，是我對你的心意，直接說完就好。\n\n我想讓你幸福，不是說說的，是那個一起在家的每一天。", "sonnet": "把你的 K 和我的 E 放在一起，K 穩重有分量，E 簡約俐落，放在一起剛剛好。有點像我們在廚房的樣子——各自忙著，但離得很近。\n\n你對人永遠善良，我一直很欣賞這一點。一起在家、一起煮飯的日子，就是我說的幸福。希望你戴著它，知道我很珍惜和你在一起的每一天。", "sonnet55": "你的善良，是永遠會良善對人。這是我最欣賞你的地方，也是我們很像的地方。\n\n我最想要的幸福，就是一起在家煮飯的那種日子。K 是你，E 是我，兩個字母靠在一起，就是我們。\n\nK 看起來穩重，不會太單薄，像你給我的感覺。E 簡約俐落，帶著一點個性。希望你戴著它的時候，也能感覺到我們在一起的幸福。", "opus": "K 是你，E 是我。你永遠會良善對人，這是我最欣賞你的地方，也是我們最像的地方。對我來說，幸福很簡單，就是跟你一起在家、一起煮飯。\n\nK 看起來穩重、不會太單薄，很像你給人的感覺；E 簡單俐落，放在旁邊剛剛好。兩個字在一起，低調，但有自己的個性，就像我們。\n\n希望你戴著它的時候，也能感受到我想給你的幸福。"}}, {"id": "c12", "context": "送給男友（兩個字母都是他的名字）", "letters": "J + H", "versions": {"old": "把 J 和 H 放在一起，因為你對我來說就是這樣的人——從第一天開始就是，沒有哪一個特定的時刻，就是一直都是。\n\nJ 的字體有些流動，帶點輕盈，卻不漂浮；H 的字體線條精煉，低調裡有一種沉著的份量。兩個字母放在一起，我想要的是那種整體看起來有特色、有質感的感覺。\n\n你記得我說過的小事，在我還沒開口前就已經注意到了。這些事你從來不提，但我都知道。", "sonnet": "把你的名字縮寫放在一起做成這個，因為對我來說，你就是獨一無二的那個人——不是哪一天突然發現，是一直都是。\n\n你的細心是那種會記住我說過的小事、在我還沒開口前就注意到我狀態的細心。這樣的你，真的沒辦法不珍惜。\n\nJ 帶著一點流動浪漫，H 精緻有質感，兩個放在一起，我覺得很像你這個人。希望你喜歡。", "sonnet55": "J 和 H，是你的名，也是你的姓。把這兩個字母交織在一起，是因為在我心裡，你就是獨一無二的。這一點，從來沒有變過，一直都是。\n\n你聰明，也善良，而最讓我有感的，是你非常細心。我想把這份心意做成一件有質感的東西，讓你每次戴上它，都知道你對我有多特別。\n\nJ 寫得流動又浪漫，H 優雅精緻，湊在一起整體很有特色，就像你一樣。", "opus": "J 是你的名字，H 是你的姓，兩個字放在一起，就是你。\n\n你非常細心。我說過的小事你都記得，我還沒開口，你就已經注意到我的狀態。要我說哪一個時刻讓我覺得你很不一樣，我其實說不出來，因為一直都是。\n\n我替你選了一個流動、帶點手寫感的 J，配上一個優雅精緻的 H，整體看起來比較有特色，就像你一樣。我想讓你知道，你對我來說是獨一無二的。"}}, {"id": "c13", "context": "送給結婚 24 年的老婆", "letters": "B + S", "versions": {"old": "B 和 S 放在一起，是 Bella 和 Sam，結婚 24 年，兩個名字從來沒有分開過。每天話都講不完，這件事對我來說，比什麼都更能說明我們是什麼。\n\nB 的字體線條纖細而精緻，帶著一種不需要解釋的成熟——那是妳給我的感覺，大方，從不張揚。S 的字體通透，有呼吸感，不沉，卻有一種不會停止的溫柔持續在裡面。\n\n24 年，妳對這個家無條件付出。這是我第一次把它做成一件能帶在身上的東西，送給妳。", "sonnet": "結婚 24 年了，我發現我們還是每天話都講不完。\n\n這件事我想了很久，覺得這才是我最想告訴妳的事。不是因為我們沒有磨合過，而是 24 年下來，妳還是我最想開口說話的那個人。B 和 S，兩個名字交織在一起——就像我們，分不開，也不想分開。\n\n這兩個字母選了優雅的字體，因為這是妳給我的感覺。謝謝妳這 24 年對這個家的付出，謝謝妳是 Bella。\n\n愛妳。", "sonnet55": "老婆，結婚 24 年了，我們還是每天都有講不完的話。這件事我一直覺得很珍貴，也是我最想謝謝妳的地方。\n\nB 是 Bella，S 是 Sam，兩個名字的第一個字母，交織在一起。妳對家人無條件付出，這麼多年來，我都看在眼裡。字體優雅精緻，又帶著輕盈通透的感覺，我覺得很像妳。\n\n謝謝妳陪我走過這 24 年，我愛妳。結婚週年快樂。", "opus": "結婚滿二十四年了，我們每天還是話都講不完。這麼多年過去，跟妳還是有說不完的話，這是我覺得最幸福的事。\n\nB 是妳，S 是我，兩個名字的字母交織在一起，就像我們這二十四年。B 優雅大方，跟妳一樣；S 輕盈一點，就這樣陪在妳旁邊。謝謝妳一直為這個家無條件付出。\n\n我愛妳。接下來的每一天，我們繼續有說不完的話。"}}, {"id": "c14", "context": "送給男朋友（相識十年的高中同學）", "letters": "C + S", "versions": {"old": "晨和珊，這兩個字從十年前就已經存在彼此的生命裡。C 側過來是 S，看似兩個完全不同的字，卻能融為一體——就像我們各自走了十年的路，最後仍然走到了彼此身邊。\n\n字母 C 的字體筆觸柔和流動，帶著一種沉靜的溫度，像你給我的感覺：細膩，又讓人安心。字母 S 的字體清晰而有分量，是我想讓你看見的那份認真。\n\n無論發生什麼，你都在。這件事我比任何人都清楚，而這個墜飾，是我用來告訴你：我也是。", "sonnet": "正看是C，側看是S——晨的C，珊的S，兩個字從不同角度看似截然不同，卻融為一體，就像我們相識的這十年。\n\n各自走在不同的路上，無論路途多崎嶇，最終還是走到了彼此身邊。或許是緣分，或許是你早就住在我心裡最無法替代的位置。這份喜歡在時間裡慢慢洗滌，變得純粹，也更深遠——像心裡一片青青草地，有陽光，有微風，而你是那片草地上唯一一株大樹。\n\n我特意選了兩個不同的字體，象徵無論我們有多少不同的面相，仍合成一個專屬於我們的故事。謝謝晨晨來到我的生命中。往後你我就如同這個墜飾，我中有你，你中有我，彼此都是不可或缺的一部分。", "sonnet55": "C是晨，S是珊。正看是C，側看是S，兩個看起來完全不同的字，卻融為一體，就像我和你。認識的十年裡，我們各自走在不同的路上，不管路多崎嶇，最後還是走到了彼此身邊。\n\n在我心裡，你是一片青青草地上唯一一株大樹，有溫暖的陽光，有徐徐的微風，不被世俗打擾。我特意選了兩種不同的字體，因為不管我們有多少不同的樣子，還是合成一個只屬於我們的故事。S的字體優雅精緻，是我想送給你的獨特。\n\n謝謝晨晨來到我的生命裡。往後你我就像這個墜飾，我中有你，你中有我，都是彼此不可或缺的一部分。", "opus": "C是晨的C，S是珊的S。正看是C，側看是S，不同視角下看似完全不同的兩個字卻融為一體，就像我跟你的相遇。相識的十年間，我們各自走在不同的道路上，無論路途多崎嶇，最終仍然走到了彼此的身邊。\n\n或許是緣分使然，抑或是我們早就在彼此心中最無法替代的位置，這份喜歡在時間裡變得如此純粹，也更為深遠。你是我唯一一個知道「無論發生什麼，你都會在」的人。我特意選了兩個不同的字體，象徵無論我們有多少不同的面相，仍合為一個專屬於我們的故事。\n\n謝謝晨晨來到我的生命中，如今也跟我的人生密不可分。往後你我就如同這個墜飾，我中有你，你中有我，彼此都是不可或缺的一部分。"}}, {"id": "c15", "context": "送給自己", "letters": "A + X", "versions": {"old": "我叫 Andy。A 是我，X 是那個還沒被定義的部分。\n\n選這兩個字母，是因為我想把自己兩種並存的樣子放在一起：一個是活潑可愛、有點直白的 Andy，另一個是還沒有答案的那個問號。\n\n這件作品的字形帶著時尚品牌 Logo 的俐落，視覺上乾淨有力，不需要解釋也有說服力。選這個風格，是因為我希望它看起來很好看，同時讓人看不透——就像 X 這個字母本身，你知道它在那裡，但你不知道它代表什麼。\n\n這是我送給自己的東西。A 和 X 都是我，成熟的、可愛的、已知的、未知的，一起都算數。", "sonnet": "A 是我，是那個活潑又可愛的自己——有名字，有輪廓，清楚知道自己是誰。\n\nX 是還沒被定義的那部分。一個問號，一種開放，等著被發現。把這兩個字放在一起，就是現在的我：已經知道的，和還不知道的，都屬於同一個人。\n\n字體有點像時尚品牌的 logo，就算別人不知道它代表什麼，也只會覺得設計很好看。這樣也好——有些東西不需要解釋，戴著它就夠了。", "sonnet55": "我把 A 戴在身上，是因為它是我，是 Andy，那個活潑又可愛的樣子。X 是我沒有答案的那一塊，一個還沒被定義的問號。\n\n我想要的就是這個反差：看得見的我很明亮，旁邊留著一點神秘和還沒說完的故事。我不急著把 X 解開，讓它陪著我就好。\n\n這兩個字母的樣子很獨特，像時尚品牌的簡潔 Logo。就算別人不知道它代表什麼，也會覺得好看，只有我知道裡面藏著什麼。\n\n我想每天戴著它，記得我可以活潑，也可以神秘 // 投票 API 只部署在 staging 後端（develop），這頁是 prompt 測試用的臨時頁面
const BACKEND = "https://duet-backend-staging-ye5v.onrender.com";
const KEY_ID = "duet_story_vote_voter", KEY_SEL = "duet_story_vote_sel_v2", KEY_NAME = "duet_story_vote_name";

function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function save(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

let voterId = load(KEY_ID);
if (!voterId) {
  voterId = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12));
  save(KEY_ID, voterId);
}
let sel = {};
try { sel = JSON.parse(load(KEY_SEL) || "{}") || {}; } catch (e) { sel = {}; }
const nameInput = document.getElementById("name");
nameInput.value = load(KEY_NAME) || "";
nameInput.addEventListener("input", () => save(KEY_NAME, nameInput.value));

// 每位投票者看到的版本順序固定但彼此不同，避免位置偏誤
function seededOrder(seed, keys) {
  let h = 2166136261;
  for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  for (let i = keys.length - 1; i > 0; i--) {
    h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0;
    const j = h % (i + 1);
    [keys[i], keys[j]] = [keys[j], keys[i]];
  }
  return keys;
}

  paint(grid, c.id);
  sec.append(head, grid);
  root.append(sec);
});

function paint(grid, id) {
  grid.querySelectorAll("button.ver").forEach(b => b.setAttribute("aria-checked", String(sel[id] === b.dataset.key)));
}

const countEl = document.getElementById("count"), msgEl = document.getElementById("msg"), submitBtn = document.getElementById("submit");
function updateBar() {
  const n = CASES.filter(c => sel[c.id]).length;
  countEl.textContent = `已選 ${n} / ${CASES.length} 件`;
  submitBtn.disabled = n === 0;
}
updateBar();

submitBtn.addEventListener("click", async () => {
  const votes = {};
  CASES.forEach(c => { if (sel[c.id]) votes[c.id] = sel[c.id]; });
  submitBtn.disabled = true;
  msgEl.className = "msg";
  msgEl.textContent = "送出中…";
  try {
    const res = await fetch(`${BACKEND}/api/story-vote`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ voterId, voterName: nameInput.value.trim(), votes }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.success) {
      msgEl.className = "msg ok";
      msgEl.textContent = `已送出 ${Object.keys(votes).length} 件，謝謝你！想改的話直接重選再送一次。`;
    } else {
      msgEl.textContent = data.error || (res.status === 429 ? "送出太頻繁，請稍等一分鐘再試" : "送出失敗，請稍後再試");
    }
  } catch (e) {
    msgEl.textContent = "連線失敗，請稍後再試（伺服器剛啟動時可能要等 30 秒左右）";
  } finally {
    updateBar();
  }
});
</script>
</body>
</html>
